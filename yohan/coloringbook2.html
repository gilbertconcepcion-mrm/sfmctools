<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yohan's SketchPad</title>
    <style>
        /* --- CSS Variables for Easy Theming --- */
        :root {
            --header-height: 60px;
            --footer-height: 200px;
            --bg-color: #2c3e50;
            --header-footer-bg: #34495e;
            --swatch-active-border: #ecf0f1;
            --status-on-color: #2ecc71;
            --status-off-color: #e74c3c;
        }

        /* --- Fullscreen Layout --- */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* --- Header --- */
        header {
            flex-shrink: 0;
            height: var(--header-height);
            background-color: var(--header-footer-bg);
            color: var(--swatch-active-border);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            position: relative; /* For positioning the status box */
        }

        h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .header-controls {
            position: absolute;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #statusBox {
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            background-color: var(--status-off-color);
            transition: background-color 0.3s ease;
        }

        #statusBox.active {
            background-color: var(--status-on-color);
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--swatch-active-border);
            font-size: 14px;
        }

        .checkbox-container input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-container label {
            cursor: pointer;
            user-select: none;
        }

        /* --- Main Canvas Area --- */
        main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0; /* A subtle background */
            position: relative;
        }

        .canvas-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            background-color: white;
        }

        #drawingCanvas, #imageCanvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        #drawingCanvas {
            z-index: 1; /* Bottom layer */
            cursor: crosshair;
        }

        #imageCanvas {
            z-index: 2; /* Top layer */
            pointer-events: none; /* Allow clicks to pass through to drawing canvas */
        }

        /* --- Footer Controls --- */
        footer {
            flex-shrink: 0;
            height: var(--footer-height);
            background-color: var(--header-footer-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.2);
            flex-wrap: wrap; /* Allows items to wrap on smaller screens */
            padding: 10px;
        }

        /* --- Color Palette --- */
        .color-palette {
            display: flex;
            gap: 15px;
        }

        .color-swatch {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 4px solid transparent;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .color-swatch:hover {
            transform: scale(1.1);
        }

        .color-swatch.active {
            border-color: var(--swatch-active-border);
            box-shadow: 0 0 15px var(--swatch-active-border);
        }

        /* --- Other Controls --- */
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--swatch-active-border);
        }

        .control-group label {
            font-size: 16px;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100px;
        }

        #sizeValue, #opacityValue {
            font-weight: bold;
            font-size: 16px;
            min-width: 35px;
            text-align: center;
        }

        /* --- Color Picker --- */
        #colorPicker {
            width: 50px;
            height: 50px;
            border: 2px solid var(--swatch-active-border);
            border-radius: 8px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        #colorPicker::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        #colorPicker::-webkit-color-swatch {
            border: none;
            border-radius: 6px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #e74c3c;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        button:hover {
            background-color: #c0392b;
            transform: scale(1.05);
        }

        /* --- Image Loader --- */
        .image-loader {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 300px;
        }

        .image-input-group {
            display: flex;
            gap: 10px;
        }

        #imageUrl {
            flex-grow: 1;
            padding: 8px;
            border-radius: 4px;
            border: none;
            font-size: 14px;
        }

        #loadImageButton {
            background-color: #3498db;
            padding: 8px 15px;
            font-size: 14px;
        }

        #loadImageButton:hover {
            background-color: #2980b9;
        }

        /* --- Responsive Design --- */
        @media (max-width: 768px) {
            :root {
                --footer-height: 260px; /* Increase height for wrapping items */
            }

            h1 {
                font-size: 22px;
            }

            .header-controls {
                right: 10px;
                flex-direction: column;
                gap: 8px;
            }

            #statusBox {
                font-size: 12px;
                padding: 6px 12px;
            }

            .checkbox-container {
                font-size: 12px;
            }

            footer {
                gap: 15px;
            }

            .color-swatch {
                width: 40px;
                height: 40px;
            }

            #colorPicker {
                width: 40px;
                height: 40px;
            }

            .control-group label {
                font-size: 14px;
            }

            button {
                padding: 8px 15px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Yohan's SketchPad</h1>
        <div class="header-controls">
            <div class="checkbox-container">
                <input type="checkbox" id="autoSketchToggle" checked>
                <label for="autoSketchToggle">Enable Auto Sketch</label>
            </div>
            <div id="statusBox">Auto Sketch: OFF</div>
        </div>
    </header>

    <main>
        <div class="canvas-container">
            <canvas id="drawingCanvas"></canvas>
            <canvas id="imageCanvas"></canvas>
        </div>
    </main>

    <footer>
        <div class="color-palette" id="colorPalette">
            <!-- Color swatches will be generated by JavaScript -->
        </div>

        <div class="control-group">
            <label for="colorPicker">Color:</label>
            <input type="color" id="colorPicker" value="#000000">
        </div>

        <div class="control-group">
            <label for="brushSize">Size:</label>
            <input type="range" id="brushSize" min="5" max="100" value="15">
            <span id="sizeValue">15</span>
        </div>

        <div class="control-group">
            <label for="opacitySlider">Opacity:</label>
            <input type="range" id="opacitySlider" min="0" max="100" value="100">
            <span id="opacityValue">100%</span>
        </div>
        
        <button id="clearButton">Clear</button>
        
        <div class="image-loader">
            <div class="image-input-group">
                <input type="text" id="imageUrl" placeholder="Enter image URL">
                <button id="loadImageButton">Load Image</button>
            </div>
        </div>
    </footer>

    <script>
        // --- JAVASCRIPT LOGIC ---

        // 1. SETUP
        const drawingCanvas = document.getElementById('drawingCanvas');
        const drawingCtx = drawingCanvas.getContext('2d');
        const imageCanvas = document.getElementById('imageCanvas');
        const imageCtx = imageCanvas.getContext('2d');
        const colorPalette = document.getElementById('colorPalette');
        const colorPicker = document.getElementById('colorPicker');
        const brushSizeSlider = document.getElementById('brushSize');
        const opacitySlider = document.getElementById('opacitySlider');
        const clearButton = document.getElementById('clearButton');
        const sizeValue = document.getElementById('sizeValue');
        const opacityValue = document.getElementById('opacityValue');
        const statusBox = document.getElementById('statusBox');
        const header = document.querySelector('header');
        const footer = document.querySelector('footer');
        const imageUrlInput = document.getElementById('imageUrl');
        const loadImageButton = document.getElementById('loadImageButton');
        const autoSketchToggle = document.getElementById('autoSketchToggle');

        // Drawing state
        let isDrawing = false;
        let isAutoDrawing = false;
        let currentColor = '#000000';
        let currentLineWidth = 15;
        let currentOpacity = 1;
        let backgroundImage = null;
        let autoSketchEnabled = true;

        // Define the colors for the palette
        const colors = [
            '#000000', '#FFFFFF', '#FF0000', '#00FF00', '#0000FF',
            '#FFFF00', '#FF00FF', '#00FFFF', '#FFA500', '#800080',
        ];

        // 2. INITIALIZATION FUNCTIONS
        function resizeCanvas() {
            // Store current canvas content
            const drawingData = drawingCtx.getImageData(0, 0, drawingCanvas.width, drawingCanvas.height);
            const imageData = imageCtx.getImageData(0, 0, imageCanvas.width, imageCanvas.height);
            
            // Set canvas size to fill the window, minus header and footer height
            const width = window.innerWidth;
            const height = window.innerHeight - header.offsetHeight - footer.offsetHeight;
            
            drawingCanvas.width = width;
            drawingCanvas.height = height;
            imageCanvas.width = width;
            imageCanvas.height = height;
            
            // Update canvas container size
            const container = document.querySelector('.canvas-container');
            container.style.width = width + 'px';
            container.style.height = height + 'px';
            
            // Restore canvas content
            drawingCtx.putImageData(drawingData, 0, 0);
            imageCtx.putImageData(imageData, 0, 0);
            
            // Redraw background image if it exists
            if (backgroundImage) {
                drawBackgroundImage();
            }
        }

        function createColorPalette() {
            colors.forEach(color => {
                const swatch = document.createElement('button');
                swatch.classList.add('color-swatch');
                swatch.style.backgroundColor = color;
                swatch.dataset.color = color;

                if (color === currentColor) {
                    swatch.classList.add('active');
                }

                swatch.addEventListener('click', selectColor);
                colorPalette.appendChild(swatch);
            });
        }

        // 3. DRAWING FUNCTIONS
        function startDrawing(e) {
            // Don't start a new path if we are just toggling auto-draw
            if (isAutoDrawing) return;
            
            isDrawing = true;
            const pos = getMousePos(e);
            drawingCtx.beginPath();
            drawingCtx.moveTo(pos.x, pos.y);
        }

        function draw(e) {
            // Draw if mouse is held down OR if auto-draw is on
            if (!isDrawing && !isAutoDrawing) return;

            const pos = getMousePos(e);

            drawingCtx.lineWidth = currentLineWidth;
            drawingCtx.strokeStyle = currentColor;
            drawingCtx.globalAlpha = currentOpacity;
            drawingCtx.lineCap = 'round';
            drawingCtx.lineJoin = 'round';

            drawingCtx.lineTo(pos.x, pos.y);
            drawingCtx.stroke();
            drawingCtx.beginPath(); // Begin a new path for the next move
            drawingCtx.moveTo(pos.x, pos.y);
        }

        function stopDrawing() {
            if (!isDrawing) return;
            isDrawing = false;
            drawingCtx.beginPath();
            // Reset globalAlpha to ensure other operations aren't affected
            drawingCtx.globalAlpha = 1;
        }
        
        // Function to toggle auto-drawing mode
        function toggleAutoDraw(e) {
            // Check if auto-sketch is enabled in settings
            if (!autoSketchEnabled) return;
            
            // Prevent toggling if the user is actually trying to draw a line
            if (isDrawing) return;

            isAutoDrawing = !isAutoDrawing;
            updateStatusBox();
        }

        function updateStatusBox() {
            if (isAutoDrawing) {
                statusBox.textContent = 'Auto Sketch: ON';
                statusBox.classList.add('active');
            } else {
                statusBox.textContent = 'Auto Sketch: OFF';
                statusBox.classList.remove('active');
            }
        }

        // Helper to get mouse position
        function getMousePos(e) {
            const rect = drawingCanvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        // 4. IMAGE LOADING FUNCTIONS
        function loadImage() {
            const url = imageUrlInput.value.trim();
            if (!url) return;

            const img = new Image();
            img.crossOrigin = 'anonymous'; // Enable cross-origin image loading
            
            img.onload = function() {
                // Create a temporary canvas to process the image
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                
                // Calculate scaling to fit the image in the canvas
                const scale = Math.min(
                    drawingCanvas.width / img.width,
                    drawingCanvas.height / img.height,
                    1
                );
                
                const width = img.width * scale;
                const height = img.height * scale;
                
                tempCanvas.width = width;
                tempCanvas.height = height;
                
                // Draw the image to the temporary canvas
                tempCtx.drawImage(img, 0, 0, width, height);
                
                // Get image data and convert to black lines with transparent background
                const imageData = tempCtx.getImageData(0, 0, width, height);
                const data = imageData.data;
                
                // Convert to black lines with transparent background
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];
                    
                    // Calculate grayscale value
                    const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                    
                    // Apply threshold to create black lines with transparent background
                    const threshold = 200;
                    
                    if (gray > threshold) {
                        // White area - make transparent
                        data[i] = 0;       // Red
                        data[i + 1] = 0;   // Green
                        data[i + 2] = 0;   // Blue
                        data[i + 3] = 0;   // Alpha (transparent)
                    } else {
                        // Dark area - make black
                        data[i] = 0;       // Red
                        data[i + 1] = 0;   // Green
                        data[i + 2] = 0;   // Blue
                        data[i + 3] = 255; // Alpha (opaque)
                    }
                }
                
                // Put the processed image data back
                tempCtx.putImageData(imageData, 0, 0);
                
                // Store the processed image
                backgroundImage = new Image();
                backgroundImage.onload = function() {
                    drawBackgroundImage();
                };
                backgroundImage.src = tempCanvas.toDataURL();
            };
            
            img.onerror = function() {
                alert('Failed to load image. Please check the URL and try again.');
            };
            
            img.src = url;
        }

        function drawBackgroundImage() {
            if (!backgroundImage) return;
            
            // Clear the image canvas
            imageCtx.clearRect(0, 0, imageCanvas.width, imageCanvas.height);
            
            // Calculate position to center the image
            const x = (imageCanvas.width - backgroundImage.width) / 2;
            const y = (imageCanvas.height - backgroundImage.height) / 2;
            
            // Draw the image on the top canvas
            imageCtx.drawImage(backgroundImage, x, y);
        }

        // 5. CONTROL HANDLERS
        function selectColor(e) {
            document.querySelectorAll('.color-swatch').forEach(swatch => {
                swatch.classList.remove('active');
            });
            e.target.classList.add('active');
            currentColor = e.target.dataset.color;
            colorPicker.value = currentColor; // Update color picker to match
        }

        function selectColorFromPicker(e) {
            currentColor = e.target.value;
            // Remove active class from all swatches
            document.querySelectorAll('.color-swatch').forEach(swatch => {
                swatch.classList.remove('active');
            });
        }

        // 6. EVENT LISTENERS
        // Drawing events - only on the drawing canvas
        drawingCanvas.addEventListener('mousedown', startDrawing);
        drawingCanvas.addEventListener('mousemove', draw);
        drawingCanvas.addEventListener('mouseup', stopDrawing);
        drawingCanvas.addEventListener('mouseout', stopDrawing);
        drawingCanvas.addEventListener('click', toggleAutoDraw);

        // Touch events for mobile
        drawingCanvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevent scrolling/zooming
            // On touch, we treat it as a click to toggle auto-draw
            if (!isAutoDrawing) {
                 startDrawing(e);
            } else {
                 toggleAutoDraw(e);
            }
        });
        drawingCanvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            draw(e);
        });
        drawingCanvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            stopDrawing();
        });

        // Control events
        colorPicker.addEventListener('input', selectColorFromPicker);
        
        brushSizeSlider.addEventListener('input', (e) => {
            currentLineWidth = e.target.value;
            sizeValue.textContent = e.target.value;
        });

        opacitySlider.addEventListener('input', (e) => {
            currentOpacity = e.target.value / 100;
            opacityValue.textContent = e.target.value + '%';
        });

        clearButton.addEventListener('click', () => {
            drawingCtx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
            imageCtx.clearRect(0, 0, imageCanvas.width, imageCanvas.height);
            backgroundImage = null;
        });

        loadImageButton.addEventListener('click', loadImage);
        
        // Allow loading image with Enter key
        imageUrlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loadImage();
            }
        });

        // Auto-sketch toggle checkbox
        autoSketchToggle.addEventListener('change', (e) => {
            autoSketchEnabled = e.target.checked;
            if (!autoSketchEnabled && isAutoDrawing) {
                isAutoDrawing = false;
                updateStatusBox();
            }
        });

        window.addEventListener('resize', resizeCanvas);

        // --- INITIALIZE ---
        createColorPalette();
        resizeCanvas();
        updateStatusBox(); // Set initial status
        
        // Initialize with a white background on the drawing canvas
        drawingCtx.fillStyle = 'white';
        drawingCtx.fillRect(0, 0, drawingCanvas.width, drawingCanvas.height);
    </script>
</body>
</html>
